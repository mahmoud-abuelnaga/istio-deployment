deploymentMode: Monolithic

defaults:
  extraEnv:
    - name: LOKI_S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: seaweedfs-credentials
          key: access-key
    - name: LOKI_S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: seaweedfs-credentials
          key: secret-key

loki:
  auth_enabled: false
  # The one-process ring has no remote peers; the chart otherwise points at
  # a memberlist Service it does not create for a single monolithic replica.
  memberlistConfig:
    join_members: []
  limits_config:
    # Match query fan-out to the single, small querier instead of queuing
    # hundreds of subqueries and holding their intermediate results in memory.
    max_query_parallelism: 4
    tsdb_max_query_parallelism: 4
    # Raised from the 256KB default: the vm-operator occasionally emits
    # single log lines >300KB. Truncate is a safety net so an even bigger
    # line can't make the distributor reject (and drop) the whole batch.
    max_line_size: 1MB
    max_line_size_truncate: true
    allow_structured_metadata: true
    discover_log_levels: true
    pattern_persistence_enabled: true
    bloom_creation_enabled: false
    bloom_split_series_keyspace_by: 1024
    bloom_gateway_enable_filtering: false
    retention_period: 720h
  commonConfig:
    replication_factor: 1
    # All modules share this process. Use an explicit local ring rather than
    # falling back to Consul when the memberlist peer list is empty.
    ring:
      kvstore:
        store: inmemory
  storage:
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    use_thanos_objstore: true
    object_store:
      s3:
        endpoint: seaweedfs.database.svc.cluster.local:8333
        region: us-east-1
        access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
        secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
        insecure: true
        bucket_lookup_type: path
        dualstack_enabled: false
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  compactor:
    working_directory: /var/loki-compactor/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 10
    delete_request_store: s3
  rulerConfig:
    wal:
      dir: /var/loki-ruler/ruler-wal
  pattern_ingester:
    enabled: true
  ingester:
    wal:
      dir: /var/loki/wal
      # Replay in batches rather than using the default 4GB ceiling at boot.
      replay_memory_ceiling: 128MB
  querier:
    max_concurrent: 2
  bloom_build:
    enabled: false
    planner:
      planning_interval: 6h
  bloom_gateway:
    enabled: false

test:
  enabled: false

lokiCanary:
  enabled: false
  extraArgs:
    - -streamname=service_name
    - -streamvalue=loki-canary

gateway:
  verboseLogging: false
  # Single Kind worker cannot satisfy hard hostname anti-affinity.
  affinity: {}
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

# One process runs ingestion, querying, scheduling, compaction, patterns and
# the ruler. Keep burst CPU available while bounding the shared Go heap.
singleBinary:
  replicas: 1
  podAnnotations:
    istio-poc/loki-storage-layout: distributed-v1
  sidecar: false
  affinity: {}
  terminationGracePeriodSeconds: 120
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
  persistence:
    # Reuse the existing ingestion, compactor and ruler volumes.
    enabled: false
    dataVolumeParameters:
      persistentVolumeClaim:
        claimName: data-loki-ingester-0
    size: 10Gi
    storageClass: csi-hostpath-sc
    enableStatefulSetAutoDeletePVC: false
    whenDeleted: Retain
    whenScaled: Retain
  extraVolumes:
    - name: distributed-compactor
      persistentVolumeClaim:
        claimName: data-loki-compactor-0
    - name: distributed-ruler
      persistentVolumeClaim:
        claimName: data-loki-ruler-0
  extraVolumeMounts:
    - name: distributed-compactor
      mountPath: /var/loki-compactor
    - name: distributed-ruler
      mountPath: /var/loki-ruler

# The modules still run inside -target=all. Only their standalone workloads
# are disabled; ruler.enabled must stay true to generate its S3 configuration.
write:
  enabled: false
  replicas: 0
read:
  enabled: false
  replicas: 0
backend:
  enabled: false
  replicas: 0
ingester:
  replicas: 0
  zoneAwareReplication:
    enabled: false
distributor:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
indexGateway:
  replicas: 0
compactor:
  replicas: 0
patternIngester:
  replicas: 0
ruler:
  enabled: true
  replicas: 0
bloomGateway:
  enabled: false
  replicas: 0
bloomPlanner:
  enabled: false
  replicas: 0
bloomBuilder:
  enabled: false
  replicas: 0

# Kind worker allocatable is ~13Gi. Chart defaults request 1024Mi for
# results-cache and 8192Mi for chunks-cache (plus an optional L2), which
# will not schedule after Kafka and VictoriaMetrics.
resultsCache:
  allocatedMemory: 32
  allocatedCPU: 10m
  connectionLimit: 1024
  # These are client-side buffers, separate from the memcached allocation.
  writebackSizeLimit: 16MB
  writebackBuffer: 256
  extraArgs:
    t: "1"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 96Mi
  persistence:
    enabled: true
    storageClass: csi-hostpath-sc

chunksCache:
  allocatedMemory: 64
  allocatedCPU: 10m
  connectionLimit: 1024
  parallelism: 2
  writebackSizeLimit: 16MB
  writebackBuffer: 256
  extraArgs:
    t: "1"
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 128Mi
  persistence:
    enabled: true
    storageClass: csi-hostpath-sc

monitoring:
  namespace: monitoring
  dashboards:
    enabled: true
    grafanaOperator:
      enabled: true
      instanceSelector:
        matchLabels:
          dashboards: grafana
  rules:
    enabled: true
  alerts:
    enabled: true
  serviceMonitor:
    enabled: true
