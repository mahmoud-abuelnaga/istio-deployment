deploymentMode: Distributed

defaults:
  extraEnv:
    - name: LOKI_S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: seaweedfs-credentials
          key: access-key
    - name: LOKI_S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: seaweedfs-credentials
          key: secret-key

loki:
  auth_enabled: false
  limits_config:
    # Raised from the 256KB default: the vm-operator occasionally emits
    # single log lines >300KB. Truncate is a safety net so an even bigger
    # line can't make the distributor reject (and drop) the whole batch.
    max_line_size: 1MB
    max_line_size_truncate: true
    allow_structured_metadata: true
    discover_log_levels: true
    pattern_persistence_enabled: true
    bloom_creation_enabled: false
    bloom_split_series_keyspace_by: 1024
    bloom_gateway_enable_filtering: false
    retention_period: 720h
  commonConfig:
    replication_factor: 1
  storage:
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    use_thanos_objstore: true
    object_store:
      s3:
        endpoint: seaweedfs.database.svc.cluster.local:8333
        region: us-east-1
        access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
        secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
        insecure: true
        bucket_lookup_type: path
        dualstack_enabled: false
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 10
    delete_request_store: s3
  pattern_ingester:
    enabled: true
  ingester:
    wal:
      dir: /var/loki/wal
  bloom_build:
    enabled: false
    planner:
      planning_interval: 6h
  bloom_gateway:
    enabled: false

test:
  enabled: false

lokiCanary:
  enabled: false
  extraArgs:
    - -streamname=service_name
    - -streamvalue=loki-canary

gateway:
  verboseLogging: false
  # Single Kind worker cannot satisfy hard hostname anti-affinity.
  affinity: {}

# SimpleScalable targets are on by default; Distributed mode uses the
# microservices components below instead.
write:
  enabled: false
  replicas: 0
read:
  enabled: false
  replicas: 0
backend:
  enabled: false
  replicas: 0

ingester:
  replicas: 1
  affinity: {}
  persistence:
    enabled: true
    claims:
      - name: data
        accessModes:
          - ReadWriteOnce
        size: 10Gi
        storageClass: local-path
  zoneAwareReplication:
    enabled: false

distributor:
  replicas: 1
  affinity: {}

querier:
  replicas: 1
  affinity: {}

queryFrontend:
  replicas: 1
  affinity: {}

queryScheduler:
  replicas: 1
  affinity: {}

indexGateway:
  replicas: 1
  affinity: {}
  persistence:
    enabled: true
    storageClass: local-path

compactor:
  replicas: 1
  affinity: {}
  persistence:
    enabled: true
    storageClass: local-path
    claims:
      - name: data
        accessModes:
          - ReadWriteOnce
        size: 10Gi
        storageClass: local-path

bloomGateway:
  enabled: false
  replicas: 0

bloomPlanner:
  enabled: false
  replicas: 0

bloomBuilder:
  enabled: false
  replicas: 0

patternIngester:
  enabled: true
  replicas: 1
  affinity: {}
  persistence:
    storageClass: local-path
    claims:
      - name: data
        accessModes:
          - ReadWriteOnce
        size: 10Gi
        storageClass: local-path

ruler:
  replicas: 1
  affinity: {}
  persistence:
    enabled: true
    storageClass: local-path

# Kind worker allocatable is ~13Gi. Chart defaults request 1024Mi for
# results-cache and 8192Mi for chunks-cache (plus an optional L2), which
# will not schedule after Kafka and VictoriaMetrics.
resultsCache:
  allocatedMemory: 64
  allocatedCPU: 25m
  persistence:
    enabled: true
    storageClass: local-path

chunksCache:
  allocatedMemory: 128
  allocatedCPU: 25m
  persistence:
    enabled: true
    storageClass: local-path

monitoring:
  namespace: monitoring
  dashboards:
    enabled: true
    grafanaOperator:
      enabled: true
      instanceSelector:
        matchLabels:
          dashboards: grafana
  rules:
    enabled: true
  alerts:
    enabled: true
  serviceMonitor:
    enabled: true
