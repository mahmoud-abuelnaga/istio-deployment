apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-2
  namespace: production
  labels:
    app.kubernetes.io/name: app-2
spec:
  parentRefs:
    - name: ingressgateway
      namespace: istio-gateway
  hostnames:
    - app-2.example.com
  rules:
    - backendRefs:
        - name: app-2
          port: 80
