apiVersion: v1
kind: Service
metadata:
  name: app-1
  namespace: production
  labels:
    app.kubernetes.io/name: app-1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: app-1
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      appProtocol: http
    - name: http-metrics
      protocol: TCP
      port: 9464
      targetPort: http-metrics
      appProtocol: http
    - name: http-envoy-prom
      protocol: TCP
      port: 15090
      targetPort: 15090
