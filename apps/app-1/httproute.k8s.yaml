apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-1
  namespace: production
  labels:
    app.kubernetes.io/name: app-1
spec:
  parentRefs:
    - name: ingressgateway
      namespace: istio-gateway
  hostnames:
    - app-1.example.com
  rules:
    - backendRefs:
        - name: app-1
          port: 80
