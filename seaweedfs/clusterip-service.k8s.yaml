apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: database
spec:
  type: ClusterIP
  selector:
    kubernetes.io/name: seaweedfs
  ports:
    - name: http-s3
      port: 8333
      targetPort: http-s3
    - name: http-master
      port: 9333
      targetPort: http-master
    - name: http-filer
      port: 8888
      targetPort: http-filer
    - name: http-admin
      port: 23646
      targetPort: http-admin
