apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: grafana.example.com
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  hosts:
    - grafana.example.com
  gateways:
    - istio-gateway/ingressgateway
  http:
    - route:
        - destination:
            host: grafana-service.monitoring.svc.cluster.local
            port:
              number: 3000
