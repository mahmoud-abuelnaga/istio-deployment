apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: google.com
  namespace: istio-gateway
spec:
  hosts:
    - google.com
  exportTo:
    - "*"
  gateways:
    - mesh
    - istio-gateway/egressgateway
  http:
    - match:
        - gateways:
            - mesh
          port: 80
      route:
        - destination:
            host: egressgateway.istio-gateway.svc.cluster.local
            port:
              number: 80
    - match:
        - gateways:
            - istio-gateway/egressgateway
          port: 80
      route:
        - destination:
            host: google.com
            port:
              number: 80
  tls:
    - match:
        - gateways:
            - mesh
          port: 443
          sniHosts:
            - google.com
      route:
        - destination:
            host: egressgateway.istio-gateway.svc.cluster.local
            port:
              number: 443
    - match:
        - gateways:
            - istio-gateway/egressgateway
          port: 443
          sniHosts:
            - google.com
      route:
        - destination:
            host: google.com
            port:
              number: 443
