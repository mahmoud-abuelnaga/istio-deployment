apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  parentRefs:
    - name: ingressgateway
      namespace: istio-gateway
  hostnames:
    - grafana.example.com
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
