apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app.kubernetes.io/name: kiali
spec:
  parentRefs:
    - name: ingressgateway
      namespace: istio-gateway
  hostnames:
    - kiali.example.com
  rules:
    - backendRefs:
        - name: kiali
          port: 20001
