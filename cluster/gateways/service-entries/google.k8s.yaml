apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: google
  namespace: istio-gateway
spec:
  hosts:
    - google.com
  location: MESH_EXTERNAL
  resolution: DNS
  exportTo:
    - "*"
  ports:
    - number: 80
      name: http
      protocol: HTTP
    - number: 443
      name: tls
      protocol: TLS