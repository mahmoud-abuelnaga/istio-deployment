apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: ingressgateway
  namespace: istio-gateway
  labels:
    app.kubernetes.io/name: ingressgateway
spec:
  selector:
    app.kubernetes.io/name: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - '*'
