apiVersion: apps/v1
kind: Deployment
metadata:
  name: egressgateway-default
  namespace: istio-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: egressgateway
      app.kubernetes.io/instance: egressgateway-default
  template:
    metadata:
      annotations:
        inject.istio.io/templates: gateway
      labels:
        app.kubernetes.io/name: egressgateway
        app.kubernetes.io/instance: egressgateway-default
        sidecar.istio.io/inject: "true"
        istio.io/rev: "default"
    spec:
      containers:
        - name: istio-proxy
          image: auto
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
            periodSeconds: 5
