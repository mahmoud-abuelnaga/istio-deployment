apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingressgateway-default
  namespace: istio-gateway
  labels:
    app.kubernetes.io/name: ingressgateway
    app.kubernetes.io/instance: ingressgateway-default
    app.kubernetes.io/version: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ingressgateway
      app.kubernetes.io/instance: ingressgateway-default
      app.kubernetes.io/version: default
  template:
    metadata:
      annotations:
        inject.istio.io/templates: gateway
      labels:
        app.kubernetes.io/name: ingressgateway
        gateway.networking.k8s.io/gateway-name: ingressgateway
        app.kubernetes.io/instance: ingressgateway-default
        app.kubernetes.io/version: default
        sidecar.istio.io/inject: "true"
        istio.io/rev: default
    spec:
      containers:
        - name: istio-proxy
          image: auto
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 6
