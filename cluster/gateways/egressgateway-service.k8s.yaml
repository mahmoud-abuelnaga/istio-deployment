apiVersion: v1
kind: Service
metadata:
  name: egressgateway
  namespace: istio-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: egressgateway
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: tls
      port: 443
      targetPort: 443
    - name: status-port
      port: 15021
      targetPort: 15021