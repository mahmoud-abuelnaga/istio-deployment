apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingressgateway
  namespace: istio-gateway
  labels:
    app.kubernetes.io/name: ingressgateway
spec:
  gatewayClassName: istio
  addresses:
    - type: Hostname
      value: ingressgateway.istio-gateway.svc.cluster.local
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
