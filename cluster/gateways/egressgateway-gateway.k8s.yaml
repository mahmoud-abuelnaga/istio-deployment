apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: egressgateway
  namespace: istio-gateway
spec:
  selector:
    app.kubernetes.io/name: egressgateway
  servers:
    - port:
        number: 80
        name: http-google
        protocol: HTTP
      hosts:
        - google.com
    - port:
        number: 443
        name: tls-google
        protocol: TLS
      tls:
        mode: PASSTHROUGH
      hosts:
        - google.com
