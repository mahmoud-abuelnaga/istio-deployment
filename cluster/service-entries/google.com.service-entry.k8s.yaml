apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: google.com
  namespace: production
spec:
  hosts:
    - google.com
    - www.google.com
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - name: https
      number: 443
      protocol: TLS

    - name: http
      number: 80
      protocol: HTTP
      targetPort: 443
