apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: database
spec:
  instances: 1
  postgresql:
    parameters:
      # Grafana's small database does not need PostgreSQL's default 128MB
      # shared buffer pool. Keep connection capacity and durability unchanged.
      shared_buffers: "32MB"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  storage:
    size: 10Gi
    storageClass: csi-hostpath-sc

  podSecurityContext:
    fsGroup: 26
    runAsUser: 26
    runAsGroup: 26
    fsGroupChangePolicy: OnRootMismatch

  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      secret:
        name: grafana-db-user
